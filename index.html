<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>《献给 LX 的 20 岁》</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#000;
    font-family:"Zpix","Fusion Pixel","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{display:block}
  #touch{
    position:fixed;left:0;right:0;bottom:0;height:150px;
    display:none;justify-content:space-between;padding:0 24px 24px;
    pointer-events:none;z-index:10;
  }
  #touch .side{display:flex;gap:18px;pointer-events:auto}
  #touch .btn{
    width:70px;height:70px;border-radius:50%;
    background:rgba(255,255,255,.1);
    border:2px solid rgba(255,255,255,.3);
    color:#fff;font-size:24px;
    display:flex;align-items:center;justify-content:center;
    align-self:flex-end;
  }
  #touch .btn:active{background:rgba(255,255,255,.28)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="side"><div class="btn" id="btnL">◀</div><div class="btn" id="btnR">▶</div></div>
  <div class="side"><div class="btn" id="btnJ">▲</div></div>
</div>
<script>
(function(){
'use strict';

/* ===================== 基础常量 ===================== */
const VW = 480, VH = 270;
const LEVEL_W = 3200;
const GROUND_Y = 230;
const TOTAL_COINS = 20;
const CAKE_X = 3020;

const GRAVITY = 0.62;
const JUMP_V  = -9.3;
const MAX_VX  = 3.0;
const ACCEL   = 0.6;
const FRICTION= 0.78;

/* 20 个字符，正好对应 20 枚金币 */
const LETTERS = 'HAPPY 20TH BIRTHDAY!';

/* 底部字母收集栏布局 */
const SLOT_N   = 20;
const SLOT_W   = 21;
const SLOT_H   = 13;
const SLOT_X0  = Math.round((VW - SLOT_W * SLOT_N) / 2);  // = 30
const SLOT_Y0  = 245;

/* ===================== 画布 ===================== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let PX = 1, OX = 0, OY = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const winW = window.innerWidth, winH = window.innerHeight;
  canvas.width  = Math.round(winW * dpr);
  canvas.height = Math.round(winH * dpr);
  canvas.style.width  = winW + 'px';
  canvas.style.height = winH + 'px';

  const targetAR = VW / VH, winAR = winW / winH;
  let gw, gh;
  if (winAR > targetAR){ gh = winH; gw = winH * targetAR; }
  else { gw = winW; gh = winW / targetAR; }

  PX = (gh / VH) * dpr;
  OX = ((winW - gw) / 2) * dpr;
  OY = ((winH - gh) / 2) * dpr;
}
window.addEventListener('resize', resize);
resize();

function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }

/* ===================== 像素光标 ===================== */
(function(){
  const rows = [
    'X...........','XX..........','XXX.........','XXXX........',
    'XXXXX.......','XXXXXX......','XXXXXXX.....','XXXXXXXX....',
    'XXXXXXXXX...','XXXXXXXXXX..','XXXXX.......','XXX.XX......',
    'XX..XX......','X...XX......','....XX......'
  ];
  const w = 12, h = 15;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.fillStyle = '#000';
  for (let y=0;y<h;y++) for (let x=0;x<w;x++) if (rows[y][x]==='X') g.fillRect(x,y,1,1);
  g.fillStyle = '#fff';
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    if (rows[y][x]!=='X') continue;
    const u = y>0 && rows[y-1][x]==='X';
    const d = y<h-1 && rows[y+1][x]==='X';
    const l = x>0 && rows[y][x-1]==='X';
    const r = x<w-1 && rows[y][x+1]==='X';
    if (u&&d&&l&&r) g.fillRect(x,y,1,1);
  }
  const url = cv.toDataURL();
  document.body.style.cursor = `url(${url}) 0 0, auto`;
})();

/* ===================== 音频 ===================== */
let audioCtx = null;
function initAudio(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  }
}
function beep(freq, dur, type, vol){
  if (!audioCtx) return;
  type = type || 'square'; vol = vol || 0.05;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  const t = audioCtx.currentTime;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfxCoin(){ beep(988,0.06,'square',0.05); setTimeout(()=>beep(1319,0.10,'square',0.05),55); }
function sfxJump(){ beep(420,0.09,'square',0.04); setTimeout(()=>beep(620,0.07,'square',0.035),60); }
function sfxWin(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square',0.06), i*110)); }

/* ===================== 关卡数据 ===================== */
const platforms = [
  { x:-80, y:GROUND_Y, w:LEVEL_W+240, h:80, ground:true },
  { x: 280, y:195, w: 90, h:12 },
  { x: 430, y:165, w: 80, h:12 },
  { x: 580, y:195, w: 90, h:12 },
  { x: 760, y:170, w: 70, h:12 },
  { x: 900, y:140, w:100, h:12 },
  { x:1080, y:185, w: 80, h:12 },
  { x:1230, y:150, w: 70, h:12 },
  { x:1370, y:120, w: 90, h:12 },
  { x:1560, y:175, w:100, h:12 },
  { x:1750, y:145, w: 80, h:12 },
  { x:1900, y:190, w: 90, h:12 },
  { x:2080, y:155, w: 70, h:12 },
  { x:2220, y:120, w:100, h:12 },
  { x:2420, y:175, w: 80, h:12 },
  { x:2570, y:145, w: 90, h:12 },
  { x:2740, y:180, w:100, h:12 }
];

const coinData = [
  [320,168],[352,168],
  [455,138],[485,138],
  [610,168],
  [790,143],
  [930,113],[962,113],
  [1110,158],
  [1255,123],
  [1400,93],[1432,93],
  [1600,148],
  [1790,118],
  [1930,163],
  [2110,128],
  [2260,93],[2292,93],
  [2460,148],
  [2610,118]
];

const clouds = [];
for (let i=0;i<10;i++) clouds.push({ x: i*210 + Math.random()*140, y: 22 + Math.random()*70, s: 0.8 + Math.random()*0.6 });
const bushes = [];
for (let i=0;i<14;i++) bushes.push({ x: 180 + i*220 + Math.random()*80, s: 0.9 + Math.random()*0.7 });

/* ===================== 游戏状态 ===================== */
let state = 'title';       // title | play | win
let stateTime = 0;
let coinCount = 0;
let toastText = '';
let toastTimer = 0;

const player = {
  x: 50, y: GROUND_Y - 14, w: 14, h: 14,
  vx: 0, vy: 0, onGround: false,
  facing: 1, walk: 0,
  spawnX: 50, spawnY: GROUND_Y - 14,
  coyote: 0, jumpBuf: 0
};

const camera = { x: 0 };
let coins = [];
const particles = [];

/* 字母系统 */
let letterSlots = [];      // { ch, filled, pop }
let flyingLetters = [];    // 飞行中的字母

const input = { left:false, right:false, jump:false };
let jumpQueued = false;

/* ===================== 输入 ===================== */
document.addEventListener('keydown', e => {
  initAudio();
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;

  switch(e.code){
    case 'ArrowLeft': case 'KeyA': input.left = true; break;
    case 'ArrowRight': case 'KeyD': input.right = true; break;
    case 'Space': case 'ArrowUp': case 'KeyW':
      input.jump = true; jumpQueued = true; break;
  }
  if (state === 'title'){ startGame(); }
  else if (state === 'win' && stateTime > 70){ resetGame(); }
});
document.addEventListener('keyup', e => {
  switch(e.code){
    case 'ArrowLeft': case 'KeyA': input.left = false; break;
    case 'ArrowRight': case 'KeyD': input.right = false; break;
    case 'Space': case 'ArrowUp': case 'KeyW': input.jump = false; break;
  }
});

const touchWrap = document.getElementById('touch');
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) touchWrap.style.display = 'flex';

function bindHold(el, on, off){
  el.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); on(); });
  el.addEventListener('pointerup',   e => { e.preventDefault(); off(); });
  el.addEventListener('pointercancel', () => off());
  el.addEventListener('pointerleave', () => off());
}
bindHold(document.getElementById('btnL'), ()=>{ input.left = true; }, ()=>{ input.left = false; });
bindHold(document.getElementById('btnR'), ()=>{ input.right = true; }, ()=>{ input.right = false; });
bindHold(document.getElementById('btnJ'), ()=>{ input.jump = true; jumpQueued = true; }, ()=>{ input.jump = false; });

canvas.addEventListener('pointerdown', e => {
  initAudio();
  if (state === 'title') startGame();
  else if (state === 'win' && stateTime > 70) resetGame();
});

/* ===================== 工具函数 ===================== */
function overlap(a,b){
  return a.x + 0.01 < b.x + b.w && a.x + a.w - 0.01 > b.x &&
         a.y + 0.01 < b.y + b.h && a.y + a.h - 0.01 > b.y;
}

function setState(s){ state = s; stateTime = 0; }

function slotCenter(i){
  return {
    x: SLOT_X0 + i * SLOT_W + SLOT_W / 2,
    y: SLOT_Y0 + SLOT_H / 2
  };
}

function initLetters(){
  letterSlots = [];
  for (let i = 0; i < SLOT_N; i++){
    letterSlots.push({ ch: LETTERS[i], filled: false, pop: 0 });
  }
  flyingLetters.length = 0;
}

function resetCoins(){
  coins = coinData.map(([x,y]) => ({ x, y, collected:false }));
  coinCount = 0;
  initLetters();
}

function startGame(){ resetGame(); }

function resetGame(){
  player.x = 50;
  player.y = GROUND_Y - player.h;
  player.vx = 0; player.vy = 0;
  player.facing = 1; player.walk = 0;
  player.spawnX = player.x; player.spawnY = player.y;
  player.coyote = 0; player.jumpBuf = 0;
  camera.x = 0;
  resetCoins();
  particles.length = 0;
  toastTimer = 0;
  setState('play');
}

function showToast(txt){ toastText = txt; toastTimer = 110; }

/* ===================== 粒子 ===================== */
function spawnFirework(x, y, hue){
  hue = (hue === undefined) ? Math.random()*360 : hue;
  const n = 34 + Math.floor(Math.random()*18);
  for (let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2 + Math.random()*0.25;
    const sp = 0.9 + Math.random()*2.6;
    particles.push({
      x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 1, decay: 0.012 + Math.random()*0.016,
      hue: hue + (Math.random()-0.5)*50,
      size: 1 + Math.random()*1.6,
      grav: 0.055
    });
  }
}
function spawnSparkle(x, y){
  for (let i=0;i<8;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 0.6 + Math.random()*1.6;
    particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 0.6,
      life: 1, decay: 0.03 + Math.random()*0.02,
      hue: 48, size: 1 + Math.random()*1.2, grav: 0.09
    });
  }
}
function updateParticles(){
  for (let i = particles.length-1; i>=0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += p.grav;
    p.vx *= 0.975; p.vy *= 0.975;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i,1);
  }
}
function drawParticles(){
  for (const p of particles){
    ctx.globalAlpha = Math.max(p.life, 0);
    px(p.x, p.y, p.size, p.size, 'hsl(' + (p.hue%360) + ',100%,62%)');
  }
  ctx.globalAlpha = 1;
}

/* ===================== 字母飞行系统 ===================== */
function spawnFlyingLetter(ch, fromX, fromY, slotIndex){
  const target = slotCenter(slotIndex);
  flyingLetters.push({
    ch,
    sx: fromX, sy: fromY,
    x: fromX, y: fromY,
    tx: target.x, ty: target.y,
    t: 0,
    dur: 38,
    slot: slotIndex
  });
}

function updateFlyingLetters(){
  for (let i = flyingLetters.length - 1; i >= 0; i--){
    const f = flyingLetters[i];
    f.t++;
    const k = Math.min(1, f.t / f.dur);
    const e = 1 - Math.pow(1 - k, 3);   // easeOutCubic
    f.x = f.sx + (f.tx - f.sx) * e;
    f.y = f.sy + (f.ty - f.sy) * e - Math.sin(k * Math.PI) * 20;

    if (k >= 1){
      const slot = letterSlots[f.slot];
      if (slot && !slot.filled){
        slot.filled = true;
        slot.pop = 14;
        beep(1100 + f.slot * 26, 0.06, 'square', 0.028);
      }
      flyingLetters.splice(i, 1);
    }
  }
}

function drawFlyingLetters(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 12px monospace';

  for (const f of flyingLetters){
    // 光晕
    ctx.globalAlpha = 0.35;
    px(f.x - 6, f.y - 7, 12, 14, '#ffd700');
    // 文字
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff8c0';
    ctx.fillText(f.ch, Math.round(f.x), Math.round(f.y));
  }
  ctx.globalAlpha = 1;
}

/* ===================== 底部收集栏 ===================== */
function drawCollectBar(){
  // 半透明底
  const bx = SLOT_X0 - 8;
  const bw = SLOT_W * SLOT_N + 16;
  px(bx, SLOT_Y0 - 4, bw, SLOT_H + 8, 'rgba(0,0,0,0.62)');
  px(bx, SLOT_Y0 - 4, bw, 1, 'rgba(255,215,0,0.55)');
  px(bx, SLOT_Y0 + SLOT_H + 3, bw, 1, 'rgba(255,215,0,0.55)');

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (let i = 0; i < SLOT_N; i++){
    const s = letterSlots[i];
    if (!s) continue;
    const cx = SLOT_X0 + i * SLOT_W + SLOT_W / 2;
    const cy = SLOT_Y0 + SLOT_H / 2;

    if (s.pop > 0){
      s.pop--;
      ctx.globalAlpha = 0.55;
      px(cx - SLOT_W/2 + 1, SLOT_Y0, SLOT_W - 2, SLOT_H, '#ffd700');
      ctx.globalAlpha = 1;
    }

    // 空格占位
    if (!s.filled){
      ctx.globalAlpha = 0.18;
      px(cx - SLOT_W/2 + 2, SLOT_Y0 + 2, SLOT_W - 4, SLOT_H - 4, '#4a4a6a');
      ctx.globalAlpha = 1;
    } else {
      // 空格字符不绘制，但格子高亮
      if (s.ch !== ' '){
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 10px monospace';
        ctx.fillText(s.ch, cx, cy + 0.5);
      } else {
        px(cx - 1, cy - 1, 2, 2, 'rgba(255,215,0,0.5)');
      }
    }
  }
}

/* ===================== 更新逻辑 ===================== */
function updatePlayer(){
  const accel = player.onGround ? ACCEL : ACCEL * 0.75;

  if (input.left){
    player.vx -= accel; player.facing = -1;
  } else if (input.right){
    player.vx += accel; player.facing = 1;
  } else {
    player.vx *= player.onGround ? FRICTION : 0.96;
  }

  player.vx = Math.max(-MAX_VX, Math.min(MAX_VX, player.vx));
  if (Math.abs(player.vx) < 0.06) player.vx = 0;

  if (jumpQueued){ player.jumpBuf = 8; jumpQueued = false; }
  else if (player.jumpBuf > 0) player.jumpBuf--;

  if (player.onGround) player.coyote = 8;
  else if (player.coyote > 0) player.coyote--;

  if (player.jumpBuf > 0 && player.coyote > 0){
    player.vy = JUMP_V;
    player.jumpBuf = 0;
    player.coyote = 0;
    player.onGround = false;
    sfxJump();
  }

  const g = (input.jump && player.vy < 0) ? GRAVITY * 0.52 : GRAVITY;
  player.vy += g;
  if (player.vy > 14) player.vy = 14;

  movePlayer();

  if (player.onGround && Math.abs(player.vx) > 0.3) player.walk += 0.32;
  else if (player.onGround) player.walk = 0;

  if (player.y > VH + 120){
    player.x = player.spawnX;
    player.y = player.spawnY;
    player.vx = 0; player.vy = 0;
  }
  if (player.onGround){
    player.spawnX = player.x;
    player.spawnY = player.y;
  }
}

function movePlayer(){
  player.x += player.vx;
  for (const p of platforms){
    if (overlap(player, p)){
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }
  player.y += player.vy;
  player.onGround = false;
  for (const p of platforms){
    if (overlap(player, p)){
      if (player.vy > 0){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0){
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }
}

function updateCoins(){
  for (const c of coins){
    if (c.collected) continue;
    if (overlap(player, { x: c.x-6, y: c.y-6, w:12, h:12 })){
      c.collected = true;
      spawnSparkle(c.x, c.y);
      sfxCoin();

      const idx = coinCount;
      coinCount++;
      if (idx < SLOT_N){
        spawnFlyingLetter(LETTERS[idx], c.x - camera.x, c.y, idx);
      }
    }
  }
}

function updateCamera(){
  const target = player.x - VW * 0.38;
  camera.x += (target - camera.x) * 0.12;
  camera.x = Math.max(0, Math.min(camera.x, LEVEL_W - VW));
}

function checkCake(){
  const cakeBox = { x: CAKE_X - 20, y: GROUND_Y - 50, w: 40, h: 50 };
  if (overlap(player, cakeBox)){
    if (coinCount >= TOTAL_COINS){
      triggerWin();
    } else {
      if (toastTimer <= 0) showToast('还差 ' + (TOTAL_COINS - coinCount) + ' 枚金币哦~');
    }
  }
}

function triggerWin(){
  // 强制落位所有飞行中的字母
  for (const f of flyingLetters){
    const slot = letterSlots[f.slot];
    if (slot && !slot.filled){ slot.filled = true; slot.pop = 14; }
  }
  flyingLetters.length = 0;

  setState('win');
  sfxWin();
  for (let i=0;i<6;i++){
    setTimeout(() => {
      if (state === 'win'){
        spawnFirework(70 + Math.random()*(VW-140), 35 + Math.random()*110);
      }
    }, i*320);
  }
}

/* ===================== 绘制：场景元素 ===================== */
function drawCloud(x, y, s){
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(Math.round(x), Math.round(y + 9*s), Math.round(44*s), Math.round(9*s));
  ctx.fillRect(Math.round(x + 7*s), Math.round(y + 2*s), Math.round(15*s), Math.round(16*s));
  ctx.fillRect(Math.round(x + 24*s), Math.round(y + 6*s), Math.round(15*s), Math.round(12*s));
  ctx.fillStyle = '#d8e8ff';
  ctx.fillRect(Math.round(x), Math.round(y + 16*s), Math.round(44*s), Math.round(2*s));
}

function drawBush(x, y, s){
  const g1 = '#3fae3f', g2 = '#2c8a2c';
  const w = 46 * s;
  ctx.fillStyle = g2;
  ctx.fillRect(Math.round(x), Math.round(y - 12*s), Math.round(w), Math.round(12*s));
  ctx.fillStyle = g1;
  ctx.fillRect(Math.round(x + 5*s), Math.round(y - 16*s), Math.round(w - 10*s), Math.round(6*s));
  ctx.fillRect(Math.round(x + 14*s), Math.round(y - 20*s), Math.round(w - 28*s), Math.round(5*s));
}

function drawGround(p){
  const cx = camera.x;
  const left  = Math.max(p.x, cx - 32);
  const right = Math.min(p.x + p.w, cx + VW + 32);

  ctx.fillStyle = '#c84c0c';
  ctx.fillRect(left - cx, p.y, right - left, p.h);
  ctx.fillStyle = '#e87830';
  ctx.fillRect(left - cx, p.y, right - left, 3);

  ctx.fillStyle = '#8a3410';
  for (let by = p.y + 3; by < p.y + p.h; by += 12){
    ctx.fillRect(left - cx, by, right - left, 1);
  }
  for (let by = p.y + 3; by < p.y + p.h; by += 12){
    const row = Math.floor((by - p.y) / 12);
    const off = (row % 2 === 0) ? 0 : 12;
    let bx = Math.floor((left - off) / 24) * 24 + off;
    for (; bx < right; bx += 24){
      if (bx >= left) ctx.fillRect(bx - cx, by, 1, 12);
    }
  }
  ctx.fillStyle = '#000';
  ctx.fillRect(left - cx, p.y, right - left, 1);
}

function drawBrickPlatform(p){
  const x = Math.round(p.x - camera.x);
  ctx.fillStyle = '#9c5a20';
  ctx.fillRect(x, p.y, p.w, p.h);
  ctx.fillStyle = '#d98a44';
  ctx.fillRect(x, p.y, p.w, 3);
  ctx.fillStyle = '#6b3a10';
  for (let bx = x; bx < x + p.w; bx += 16){
    ctx.fillRect(bx, p.y + 3, 1, p.h - 3);
  }
  ctx.fillRect(x, p.y + p.h - 1, p.w, 1);
  ctx.fillStyle = '#000';
  ctx.fillRect(x, p.y, p.w, 1);
}

function drawCoin(cx, cy, now){
  const t = now / 260 + cx * 0.06;
  const w = Math.abs(Math.cos(t)) * 8 + 2;
  const x = Math.round(cx - camera.x - w/2);
  const y = Math.round(cy - 6);

  ctx.fillStyle = '#b8860b';
  ctx.fillRect(x - 1, y - 1, Math.round(w) + 2, 14);
  ctx.fillStyle = '#fcd000';
  ctx.fillRect(x, y, Math.round(w), 12);
  if (w > 4){
    ctx.fillStyle = '#ffef8a';
    ctx.fillRect(x + Math.round(w*0.28), y + 2, Math.max(1, Math.round(w*0.35)), 8);
  }
  ctx.fillStyle = '#8a6500';
  ctx.fillRect(x, y, Math.round(w), 1);
  ctx.fillRect(x, y + 11, Math.round(w), 1);
}

function drawCake(cx, baseY, now){
  const x = Math.round(cx - camera.x);
  const y = baseY;

  px(x-24, y-4, 48, 4, '#b8b8b8');
  px(x-22, y-6, 44, 2, '#e8e8e8');

  px(x-19, y-17, 38, 12, '#f2cf6b');
  px(x-19, y-14, 38, 1, '#d4a93c');

  px(x-19, y-21, 38, 5, '#ff9eb5');
  for (let i=-17; i<=17; i+=6) px(x+i, y-17, 3, 3, '#ff9eb5');

  px(x-14, y-31, 28, 11, '#f2cf6b');
  px(x-14, y-28, 28, 1, '#d4a93c');

  px(x-14, y-35, 28, 5, '#ff9eb5');
  for (let i=-12; i<=12; i+=6) px(x+i, y-31, 3, 3, '#ff9eb5');

  px(x-2, y-46, 4, 11, '#ffffff');
  px(x-2, y-44, 4, 2, '#e74c3c');
  px(x-2, y-40, 4, 2, '#e74c3c');

  const f = Math.sin(now/90) * 0.8;
  px(x-1, y-52 + f, 2, 5, '#ffd700');
  px(x-1, y-51 + f, 2, 3, '#ff9800');
  px(x-1, y-50 + f, 1, 2, '#ffffff');

  if (coinCount >= TOTAL_COINS){
    const pulse = 0.35 + 0.25 * Math.sin(now/220);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(x-30, y-58, 60, 60);
    ctx.globalAlpha = 1;
  }
}

/* ===================== 绘制：赫曼陆龟主角 ===================== */
function drawTurtle(sx, sy, facing, walkPhase){
  ctx.save();
  ctx.translate(Math.round(sx), Math.round(sy));
  if (facing < 0){ ctx.translate(16, 0); ctx.scale(-1, 1); }

  /* 赫曼陆龟配色 */
  const shellD = '#2a1a0c';   // 壳轮廓（最深）
  const shell  = '#4a2f16';   // 壳主体（深棕）
  const shellM = '#6b4520';   // 壳中调
  const shellL = '#8a6438';   // 壳边缘黄棕
  const skin   = '#b09a72';   // 皮肤（灰褐）
  const skinD  = '#8a7450';   // 皮肤阴影
  const leg    = '#6b5540';   // 腿（深褐灰）
  const eye    = '#0a0a0a';

  const lo = Math.sin(walkPhase) > 0 ? 1 : 0;

  /* 腿 */
  px(2, 10 + lo, 3, 3, leg);
  px(9, 10 - lo, 3, 3, leg);

  /* 龟壳 */
  px(0, 1, 13, 10, shellD);      // 轮廓
  px(1, 2, 11, 8, shell);        // 主体
  px(1, 2, 11, 1, shellL);       // 上缘黄棕
  px(1, 9, 11, 1, shellL);       // 下缘黄棕

  /* 盾片纹路 */
  px(2, 4, 3, 2, shellM);
  px(6, 4, 3, 2, shellM);
  px(4, 6, 3, 2, shellM);
  px(8, 6, 3, 2, shellM);
  px(4, 3, 3, 1, shellM);

  /* 头 */
  px(12, 4, 4, 6, skin);
  px(12, 4, 4, 1, skinD);
  px(12, 9, 4, 1, skinD);

  /* 眼 & 嘴 */
  px(14, 6, 1, 1, eye);
  px(15, 8, 1, 1, skinD);

  ctx.restore();
}

/* ===================== 绘制：HUD ===================== */
function drawHUD(){
  ctx.textBaseline = 'middle';

  ctx.textAlign = 'left';
  ctx.font = 'bold 9px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillText('from cxr to lx', 11, 15);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('from cxr to lx', 10, 14);

  ctx.textAlign = 'right';
  ctx.font = 'bold 10px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillText(coinCount + ' / ' + TOTAL_COINS, VW - 9, 15);
  ctx.fillStyle = coinCount >= TOTAL_COINS ? '#7CFC00' : '#ffd700';
  ctx.fillText(coinCount + ' / ' + TOTAL_COINS, VW - 10, 14);

  const cx = VW - 66, cy = 14;
  ctx.fillStyle = '#b8860b'; ctx.fillRect(cx-1, cy-6, 9, 13);
  ctx.fillStyle = '#fcd000'; ctx.fillRect(cx, cy-5, 7, 11);
  ctx.fillStyle = '#ffef8a'; ctx.fillRect(cx+2, cy-3, 2, 6);
}

function drawToast(){
  const a = Math.min(1, toastTimer / 30);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
  const w = ctx.measureText(toastText).width + 26;
  const bx = (VW - w) / 2, by = 42;

  ctx.fillStyle = 'rgba(0,0,0,.72)';
  ctx.fillRect(bx, by, w, 22);
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, w - 1, 21);

  ctx.fillStyle = '#ffd700';
  ctx.fillText(toastText, VW/2, by + 12);
  ctx.globalAlpha = 1;
}

/* ===================== 绘制：标题页 ===================== */
function renderTitle(now){
  ctx.fillStyle = '#5c94fc';
  ctx.fillRect(0, 0, VW, VH);

  drawCloud(50, 40, 1);
  drawCloud(300, 24, 1.15);
  drawCloud(400, 76, 0.85);

  for (const b of bushes) drawBush(b.x, GROUND_Y, b.s);
  drawGround({ x:-80, y:GROUND_Y, w:VW+160, h:80 });

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  /* 主标题：《献给 LX 的 20 岁》 */
  ctx.font = 'bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.fillText('《献给 LX 的 20 岁》', VW/2 + 2, 84 + 2);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('《献给 LX 的 20 岁》', VW/2, 84);

  /* 副标题 */
  ctx.font = 'bold 10px monospace';
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillText('A  BIRTHDAY  ADVENTURE', VW/2 + 1, 108 + 1);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('A  BIRTHDAY  ADVENTURE', VW/2, 108);

  /* 小乌龟 */
  const bob = Math.sin(now / 260) * 2;
  drawTurtle(VW/2 - 8, GROUND_Y - 14 + bob, 1, now / 120);

  /* 闪烁提示 */
  if (Math.floor(now / 480) % 2 === 0){
    ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillText('按 空格 / 点击屏幕 开始', VW/2 + 1, 186 + 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('按 空格 / 点击屏幕 开始', VW/2, 186);
  }

  ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.78)';
  ctx.fillText('← → 移动   ·   空格 跳跃   ·   集齐 20 枚金币', VW/2, 206);
}

/* ===================== 绘制：游戏页 ===================== */
function renderGame(now){
  ctx.fillStyle = '#5c94fc';
  ctx.fillRect(0, 0, VW, VH);

  const span = 900;
  for (const c of clouds){
    let x = c.x - camera.x * 0.35;
    x = ((x % span) + span) % span - 100;
    if (x > -120 && x < VW + 120) drawCloud(x, c.y, c.s);
  }

  for (const b of bushes){
    const x = b.x - camera.x * 0.6;
    if (x > -80 && x < VW + 80) drawBush(x, GROUND_Y, b.s);
  }

  for (const p of platforms){
    if (p.x + p.w < camera.x - 60 || p.x > camera.x + VW + 60) continue;
    if (p.ground) drawGround(p);
    else drawBrickPlatform(p);
  }

  if (CAKE_X - camera.x > -80 && CAKE_X - camera.x < VW + 80){
    drawCake(CAKE_X, GROUND_Y, now);
  }

  for (const c of coins){
    if (c.collected) continue;
    if (c.x < camera.x - 30 || c.x > camera.x + VW + 30) continue;
    drawCoin(c.x, c.y, now);
  }

  drawParticles();

  drawTurtle(player.x - camera.x - 1, player.y - 1, player.facing, player.walk);

  drawCollectBar();
  drawFlyingLetters();

  drawHUD();

  if (toastTimer > 0){
    toastTimer--;
    drawToast();
  }
}

/* ===================== 绘制：通关书信页 ===================== */
function renderWin(now){
  const t = stateTime;

  const dark = Math.min(0.82, t / 45);
  ctx.fillStyle = 'rgba(6,8,24,' + dark + ')';
  ctx.fillRect(0, 0, VW, VH);

  drawParticles();

  const pw = 404, ph = 220;
  const px0 = Math.round((VW - pw) / 2);
  const py0 = Math.round((VH - ph) / 2);

  /* 面板 */
  ctx.fillStyle = '#0d1024';
  ctx.fillRect(px0, py0, pw, ph);

  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.strokeRect(px0 + 2, py0 + 2, pw - 4, ph - 4);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.strokeRect(px0 + 6, py0 + 6, pw - 12, ph - 12);

  const corners = [[px0+2,py0+2],[px0+pw-8,py0+2],[px0+2,py0+ph-8],[px0+pw-8,py0+ph-8]];
  for (const [cx, cy] of corners) px(cx, cy, 6, 6, '#ffd700');

  ctx.textBaseline = 'middle';
  const ease = (delay) => Math.max(0, Math.min(1, (t - delay) / 24));

  /* ---- To LX ---- */
  if (ease(6) > 0){
    ctx.globalAlpha = ease(6);
    ctx.textAlign = 'left';
    ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#6fe3ff';
    ctx.fillText('To  LX', px0 + 34, py0 + 34);

    /* 分隔线 */
    ctx.fillStyle = 'rgba(255,215,0,0.45)';
    ctx.fillRect(px0 + 34, py0 + 50, pw - 68, 1);
    ctx.globalAlpha = 1;
  }

  /* ---- 正文第一行 ---- */
  if (ease(20) > 0){
    ctx.globalAlpha = ease(20);
    ctx.textAlign = 'center';
    ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillText('20 岁生日快乐~！！', VW/2 + 1, py0 + 82 + 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('20 岁生日快乐~！！', VW/2, py0 + 82);
    ctx.globalAlpha = 1;
  }

  /* ---- 正文第二行 ---- */
  if (ease(34) > 0){
    ctx.globalAlpha = ease(34);
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillText('祝你天天开心，平安顺遂！！', VW/2 + 1, py0 + 108 + 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('祝你天天开心，平安顺遂！！', VW/2, py0 + 108);
    ctx.globalAlpha = 1;
  }

  /* ---- 颜文字 ---- */
  if (ease(50) > 0){
    ctx.globalAlpha = ease(50);
    ctx.textAlign = 'center';
    ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#ffb3d1';
    ctx.fillText('(๑˃̵ᴗ˂̵)و', VW/2 - 44, py0 + 142);
    ctx.fillStyle = '#a5e887';
    ctx.fillText('₍˄·͈༝·͈˄*₎◞ ̑̑', VW/2 + 52, py0 + 142);
    ctx.globalAlpha = 1;
  }

  /* ---- 落款 ---- */
  if (ease(66) > 0){
    ctx.globalAlpha = ease(66);
    ctx.textAlign = 'right';

    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillText('From  CXR', px0 + pw - 33, py0 + 182 + 1);
    ctx.fillStyle = '#ffd700';
    ctx.fillText('From  CXR', px0 + pw - 34, py0 + 182);

    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillText('2026.9.17', px0 + pw - 33, py0 + 202 + 1);
    ctx.fillStyle = '#cfd8ff';
    ctx.fillText('2026.9.17', px0 + pw - 34, py0 + 202);

    ctx.globalAlpha = 1;
  }

  /* ---- 重玩提示 ---- */
  if (t > 110 && Math.floor(t / 40) % 2 === 0){
    ctx.textAlign = 'center';
    ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillText('按 空格 / 点击 再玩一次', VW/2, VH - 14);
  }
}

/* ===================== 主循环 ===================== */
let lastTime = 0;
let acc = 0;
const STEP = 1000 / 60;

function update(){
  stateTime++;

  if (state === 'play'){
    updatePlayer();
    updateCoins();
    updateCamera();
    updateFlyingLetters();
    checkCake();
  }

  updateParticles();

  if (state === 'win' && stateTime > 60 && stateTime % 55 === 0){
    spawnFirework(70 + Math.random()*(VW-140), 30 + Math.random()*110);
  }
}

function render(now){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.setTransform(PX, 0, 0, PX, OX, OY);
  ctx.imageSmoothingEnabled = false;

  if (state === 'title'){
    renderTitle(now);
  } else {
    renderGame(now);
    if (state === 'win') renderWin(now);
  }
}

function loop(now){
  requestAnimationFrame(loop);

  if (!lastTime) lastTime = now;
  let dt = now - lastTime;
  lastTime = now;
  if (dt > 120) dt = 120;
  acc += dt;

  let guard = 0;
  while (acc >= STEP && guard++ < 5){
    update();
    acc -= STEP;
  }

  render(now);
}

/* ===================== 启动 ===================== */
initLetters();
resetCoins();
requestAnimationFrame(loop);

})();
</script>
